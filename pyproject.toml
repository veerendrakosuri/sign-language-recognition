[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sign-language-recognition"
version = "0.2.0"
description = "Developer toolkit and CLI for experimental isolated ASL word recognition"
readme = "PACKAGE_README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Veerendra Kosuri"}]
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<3"]
keywords = ["asl", "sign-language", "landmarks", "machine-learning", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/veerendrakosuri/sign-language-recognition"
Documentation = "https://github.com/veerendrakosuri/sign-language-recognition/blob/main/docs/PACKAGE_GUIDE.md"
Issues = "https://github.com/veerendrakosuri/sign-language-recognition/issues"
Demo = "https://signlab-asl-veerendra.heartyspoon1024.chatgpt.site"

[project.optional-dependencies]
vision = ["opencv-contrib-python>=4.10,<6", "mediapipe>=0.10.20,<0.11"]
baseline = ["scikit-learn>=1.4,<2", "joblib>=1.3,<2"]
train = ["scikit-learn>=1.4,<2", "joblib>=1.3,<2", "torch>=2.6,<3", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "twine>=6,<8"]

[project.scripts]
signlang = "signlang.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
