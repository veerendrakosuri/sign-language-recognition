name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -c "import cv2, mediapipe; from signlang.landmarks import Extractor; print(cv2.__version__, mediapipe.__version__)"
      - run: python -m pytest -q
      - run: python -m signlang.cli download-models
      - run: python scripts/check_landmarkers.py
